name: Deploy Strapi to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Node.js on the runner
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # Install dependencies on runner
      - name: Install dependencies
        run: yarn install

      # Build Strapi admin panel
      - name: Build Strapi
        run: yarn build

      # Add VPS to known_hosts
      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Load SSH key for deployment
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STRAPI_DEPLOY }}

      # Sync files to VPS and run Strapi
      - name: Sync files and start Strapi
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '.tmp' \
            ./ hansluber@103.191.63.173:/home/hansluber/stressfuldev-CMS

          ssh hansluber@103.191.63.173 << 'EOF'
            cd /home/hansluber/stressfuldev-CMS

            # Load nvm environment
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Install production dependencies
            /home/hansluber/.nvm/versions/node/v22.14.0/bin/yarn install --production

            # Start or restart Strapi in production using ecosystem.config.js
            /home/hansluber/.nvm/versions/node/v22.14.0/bin/pm2 startOrRestart ecosystem.config.js --env production
          EOF
