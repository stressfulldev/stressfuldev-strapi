name: Deploy Strapi to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Install dependencies and build Strapi
      - name: Install & Build Strapi
        run: |
          yarn install --frozen-lockfile
          yarn build

      # 3. Setup SSH to VPS
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STRAPI_DEPLOY }}

      # 4. Sync necessary files to VPS
      - name: Deploy to VPS
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.env' \
            --exclude '.tmp' \
            ./ hansluber@103.191.63.173:/home/hansluber/stressfuldev-CMS

          ssh -o StrictHostKeyChecking=no hansluber@103.191.63.173 << 'EOF'
            cd /home/hansluber/stressfuldev-CMS
            # Install production dependencies only
            yarn install --production
            # Stop existing Strapi process
            pm2 stop strapi || true
            # Start Strapi in production mode
            pm2 start yarn --name strapi -- run start
          EOF
